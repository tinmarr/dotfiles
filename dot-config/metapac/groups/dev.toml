arch = {
    packages = [
        # neovim
        "neovim",
        "lazygit",
        "tree-sitter-cli",

        # tmux
        "tmux",
        "tmux-plugin-manager",

        # misc dev apps
        "codex-desktop", # managed/installed with make
        "openai-codex",
        "t3code-bin",
        "opencode",

        # clis
        "ollama",
        "python-openai-whisper",
        "github-cli",
        "direnv",

        # languages
        "clang",
        "go",
        "typescript",
        "rustup",
        "typst",

        # tooling
        "cmake",
        "gdb",
        "valgrind",
        "just",
        "pnpm",
        "platformio-core",
        "platformio-core-udev",
        "hugo",
        "uv",
        "postgresql",

        # podman
        {
            name = "podman",
            hooks = {
                after_install = [
                    "systemctl",
                    "--user",
                    "enable",
                    "--now",
                    "podman.socket",
                ],
            },
        },
        "docker-compose",
    ]
}
